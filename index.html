<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>씨닛</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0064FF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="씨닛" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script>
      (() => {
        try {
          const preference = localStorage.getItem('seenit-theme-preference') || 'system';
          const systemDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches;
          const resolved = preference === 'dark' || (preference === 'system' && systemDark)
            ? 'dark'
            : 'light';
          document.documentElement.classList.toggle('dark', resolved === 'dark');
          document.documentElement.dataset.theme = resolved;
          document.documentElement.dataset.themePreference = preference;
          document.documentElement.style.colorScheme = resolved;
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
